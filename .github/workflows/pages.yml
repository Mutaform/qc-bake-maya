name: Publish QC Bake for Maya

# Builds the release zip and the update manifest, and publishes both to
# GitHub Pages. The installed tool reads version.json from there and tells the
# artist when a newer release exists - Maya has no add-on repository of its
# own, so this is the whole update channel.
#
# The manifest is generated by the same script that builds the zip, never by
# hand: a manifest whose version disagrees with the archive beside it
# advertises an update that installs nothing and is then offered forever.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "qc_bake_maya/**"
      - "install/**"
      - "icons/**"
      - "tools/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The logic layer imports nothing from Maya, so it is tested on every
      # publish. A release that fails these should never reach a shelf.
      - name: Test
        shell: pwsh
        run: |
          python tests/test_core.py
          python tests/test_updater.py

      - name: Build release and manifest
        shell: pwsh
        env:
          QCBAKE_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: tools/build_release.ps1

      - name: Show what will be published
        shell: pwsh
        run: |
          Get-ChildItem pages
          Get-Content pages/version.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
          force_orphan: true
